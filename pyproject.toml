[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mhpmr"
version = "0.1.0"
description = "Monocular 3D Human Pose and Mesh Recovery using hybrid dense-parametric learning"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Nayana Jitesh", email = "nayana@example.com"}
]
requires-python = ">=3.8"
keywords = ["pose-estimation", "mesh-recovery", "3d-reconstruction", "human", "computer-vision"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "numpy>=1.21.0,<2.0.0",
    "scipy>=1.7.0",
    "tensorflow>=2.11.0",
    "opencv-python>=4.5.0",
    "pillow>=8.3.0",
    "matplotlib>=3.4.0",
    "scikit-image>=0.18.0",
    "trimesh>=3.9.0",
    "networkx>=2.6.0",
    "tqdm>=4.62.0",
    "pyyaml>=5.4.0",
    "click>=8.0.0",
    "pydantic>=1.8.0",
    "chumpy>=0.70",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "pytest-benchmark>=3.4.1",
    "black>=21.0",
    "flake8>=3.9.0",
    "isort>=5.9.0",
    "mypy>=0.900",
]

torch = [
    "torch>=1.9.0",
    "torchvision>=0.10.0",
]

[project.urls]
Homepage = "https://github.com/nayanajitesh09/mhpmr-dev"
Repository = "https://github.com/nayanajitesh09/mhpmr-dev.git"
Issues = "https://github.com/nayanajitesh09/mhpmr-dev/issues"
Documentation = "https://github.com/nayanajitesh09/mhpmr-dev/wiki"

[tool.setuptools]
packages = ["mhpmr"]
package-dir = {"" = "src"}

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "benchmark: marks tests as benchmark",
]
